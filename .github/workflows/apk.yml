# KIWI: builds the Kiwi Native APK (hernandez.kiwinative, debug-signed) on a GitHub-hosted Linux runner and uploads it as an artifact. Run it from the Actions tab
# (engine "real" makes the on-device packer's stage first, android/ondevice/build.sh; "fake" builds the simulated packer, for the screens only).
name: apk

on:
  workflow_dispatch:
    inputs:
      engine:
        description: 'On-device packer: real (builds the stage first) or fake (simulated, screens only)'
        type: choice
        options: [real, fake]
        default: real

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  apk:
    name: Kiwi Native APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'   # the translator (dm/gfx/tools/dmsh_xlate_android) is NativeAOT on .NET 10
      - name: Android SDK and NDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh ninja-build cmake clang zlib1g-dev
      - name: Stage the on-device packer
        if: inputs.engine == 'real'
        run: zsh kiwi/scripts/ondevice-stage.sh "$RUNNER_TEMP/work"
      - name: Gradle apk
        working-directory: android/app
        run: |
          if [ "${{ inputs.engine }}" = real ]; then ENGINE="-PnxPackStage=$RUNNER_TEMP/work/stage"; else ENGINE="-PnxPackEngine=fake"; fi
          ./gradlew --no-daemon -PnxApp=kiwi -PnxLabel="Kiwi Native" "$ENGINE" apk
          ls -la out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiwi-native-apk
          path: android/app/out/*.apk
          if-no-files-found: error
