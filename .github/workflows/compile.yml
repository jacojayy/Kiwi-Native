# KIWI: a quick compile of the launcher's Java (no packer stage, no native build), to catch an error before a full APK build. Run from the Actions tab.
name: compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile the launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Android SDK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Compile
        working-directory: android/app
        run: ./gradlew --no-daemon -PnxApp=kiwi -PnxPackEngine=fake -PnxGenSeeds=true compileDebugJavaWithJavac -x externalNativeBuildDebug 2>&1 | tail -80
